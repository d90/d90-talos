apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rtunnel
  namespace: default
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: rtunnel
    gethomepage.dev/description: Rutgers SSH tunnel status
    gethomepage.dev/group: Network
    gethomepage.dev/icon: mdi-tunnel-outline
    gethomepage.dev/href: https://rtunnel.d90.name
    gethomepage.dev/pod-selector: app=rtunnel
spec:
  entryPoints:
    - websecure
  routes:
    # traefik-unbound registers this host -> Traefik VIP. Never create a manual Unbound override for rtunnel.d90.name pointing at the tunnel LB (10.10.100.102): both A records would be served.
    - match: Host(`rtunnel.d90.name`)
      kind: Rule
      services:
        - name: rtunnel-status
          kind: Service
          port: 80
  tls:
    secretName: tls.rtunnel
