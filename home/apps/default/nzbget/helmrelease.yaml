apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbget
  namespace: default
spec:
  interval: 5m

  chart:
    spec:
      chart: nzbget
      version: "30.13.0" # Ensure this matches the available nzbget chart version in your repo
      sourceRef:
        kind: HelmRepository
        name: tc-truecharts
        namespace: flux-system
      interval: 1h

  values:

    # ───────────────────────────────────────────────
    # Init container image: pinned python-alpine, used to fetch the static 7-Zip
    # (busybox tar can't decode 7-Zip's x86-BCJ xz archive; python's lzma can)
    # ───────────────────────────────────────────────
    sevenZipImage:
      repository: docker.io/library/python
      tag: "3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72"
      pullPolicy: IfNotPresent

    # ───────────────────────────────────────────────
    # Disable metrics to avoid ServiceMonitor CRDs
    # ───────────────────────────────────────────────
    metrics:
      main:
        enabled: false
        serviceMonitor:
          enabled: false

    # ───────────────────────────────────────────────
    # Disable built-in ingress
    # ───────────────────────────────────────────────
    ingress:
      main:
        enabled: false

    # ───────────────────────────────────────────────
    # Service definition
    # ───────────────────────────────────────────────
    service:
      main:
        enabled: true
        primary: true
        ports:
          main:
            enabled: true
            primary: true
            protocol: http
            port: 6789      # Changed for nzbget
            targetPort: 6789 # Changed for nzbget

    # ───────────────────────────────────────────────
    # Persistence (media + config)
    # ───────────────────────────────────────────────
    persistence:
      media:
        enabled: true
        type: pvc
        existingClaim: nfs-pvc-data
        mountPath: /media

      config:
        enabled: true
        type: pvc
        storageClass: nfs-client
        size: 10Gi
        existingClaim: ""
        mountPath: /config

      # Static 7-Zip build, populated by the install-7zip init container
      sevenzip:
        enabled: true
        type: emptyDir
        mountPath: /opt/7zip
        targetSelector:
          main:
            main:
              mountPath: /opt/7zip
            install-7zip:
              mountPath: /opt/7zip

    # ───────────────────────────────────────────────
    # Workload + PRODUCTION-GRADE PROBES
    # ───────────────────────────────────────────────
    workload:
      main:
        type: Deployment
        enabled: true
        primary: true

        podSpec:
          securityContext:
            container:
              readOnlyRootFilesystem: false

          initContainers:
            install-7zip:
              enabled: true
              type: init
              imageSelector: sevenZipImage
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # 7-Zip 26.04 static x64 build from https://www.7-zip.org/download.html
                  cd /tmp
                  wget -q -O 7z.tar.xz https://www.7-zip.org/a/7z2604-linux-x64.tar.xz
                  echo "fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd  7z.tar.xz" | sha256sum -c -
                  python3 -c "import tarfile; tarfile.open('7z.tar.xz').extract('7zzs', '/opt/7zip')"
                  chmod 0755 /opt/7zip/7zzs

          containers:
            main:
              enabled: true
              primary: true
              imageSelector: image

              # Correct container port
              ports:
                - name: main
                  containerPort: 6789 # Changed for nzbget

              # ───────────────────────────────────────
              # STABLE PROBES FOR NFS + LARGE LIBRARIES
              # ───────────────────────────────────────

              probes:
                # NZBGet returns 401 on all HTTP paths — use TCP to check port is open
                readiness:
                  enabled: true
                  type: tcp
                  port: main
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 12
                  successThreshold: 1

                liveness:
                  enabled: true
                  type: tcp
                  port: main
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 2
                  failureThreshold: 10

                startup:
                  enabled: true
                  type: tcp
                  port: main
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 90