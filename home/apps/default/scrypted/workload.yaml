apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app scrypted
  annotations:
    {}
  labels:
    app: *app
  namespace: default
spec:
  selector:
    matchLabels:
      app: *app
  template:
    metadata:
      labels:
        app: *app
    spec:
      containers:
        - imagePullPolicy: Always
          name: *app
          volumeMounts:
            - name: nfs-conf
              mountPath: /server/volume
              subPath: scrypted/config
          image: ghcr.io/koush/scrypted:latest@sha256:294be875371dc4f2897174120ce707c43bde8d18e41545077c4c6c88911af990
          envFrom:
            - prefix: ''
              configMapRef:
                name: scrypted
                optional: false              
      hostNetwork: true
      restartPolicy: Always
      volumes:
        - name: nfs-conf
          persistentVolumeClaim: 
            claimName: nfs-pvc-containerdata 
  replicas: 1
  # revisionHistoryLimit: 1
  strategy:
    type: Recreate
