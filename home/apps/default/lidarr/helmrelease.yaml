apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: default
spec:
  interval: 5m

  chart:
    spec:
      chart: lidarr
      version: "30.2.2" # Ensure this matches the available lidarr chart version in your repo
      sourceRef:
        kind: HelmRepository
        name: tc-truecharts
        namespace: flux-system
      interval: 1h

  values:
    podOptions:
      # TrueCharts' default affinity requires co-location with ANY pod whose PVC
      # has the same short name (e.g. every app's 'config'), chaining unrelated
      # apps to one node. Pointless on NFS; blocks the descheduler from rebalancing.
      defaultAffinity: false

    # ───────────────────────────────────────────────
    # Disable metrics to avoid ServiceMonitor CRDs
    # ───────────────────────────────────────────────
    metrics:
      main:
        enabled: false

    # ───────────────────────────────────────────────
    # Disable built-in ingress
    # ───────────────────────────────────────────────
    ingress:
      main:
        enabled: false

    # ───────────────────────────────────────────────
    # Service definition
    # ───────────────────────────────────────────────
    service:
      main:
        enabled: true
        primary: true
        ports:
          main:
            enabled: true
            primary: true
            protocol: http
            port: 8686       # Changed for lidarr
            targetPort: 8686 # Changed for lidarr

    # ───────────────────────────────────────────────
    # Persistence (media + config)
    # ───────────────────────────────────────────────
    persistence:
      media:
        enabled: true
        type: pvc
        existingClaim: nfs-pvc-data
        mountPath: /media

      config:
        enabled: true
        type: pvc
        storageClass: nfs-client
        size: 10Gi
        existingClaim: ""
        mountPath: /config

    # ───────────────────────────────────────────────
    # Workload + PRODUCTION-GRADE PROBES
    # ───────────────────────────────────────────────
    workload:
      main:
        type: Deployment
        enabled: true
        primary: true

        podSpec:

          containers:
            main:
              enabled: true
              primary: true
              imageSelector: image
              env:
                DOTNET_SYSTEM_NET_DISABLEIPV6: "true"

              # ───────────────────────────────────────
              # STABLE PROBES FOR NFS + LARGE LIBRARIES
              # ───────────────────────────────────────

              probes:
                # lidarr becomes ready long before it is fully scanned
                readiness:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    periodSeconds: 10
                    timeoutSeconds: 2
                    failureThreshold: 12   # ~2 minutes
                    successThreshold: 1

                # Liveness probe must be gentle — lidarr can stall briefly
                liveness:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    initialDelaySeconds: 30
                    periodSeconds: 20
                    timeoutSeconds: 2
                    failureThreshold: 10   # ~3 minutes
                    successThreshold: 1

                # Startup probe prevents container kills during long boot
                startup:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    periodSeconds: 10
                    timeoutSeconds: 2
                    failureThreshold: 90   # 15 minutes startup window