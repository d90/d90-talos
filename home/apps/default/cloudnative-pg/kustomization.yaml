apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # - operator.yaml
  # - test.yaml
  # - test2.yaml
  - secret.sops.yaml
  # - tls.yaml
  # Upgrade one minor at a time (upstream recommendation) and read the
  # release notes / installation_upgrade.md for every intermediate minor.
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.4.yaml
patches:
  # Safety: never let Flux prune the CNPG CRDs (e.g. if the line above is
  # removed/commented). Deleting a CRD cascade-deletes every Cluster and,
  # via ownerReferences, its PVCs.
  - target:
      kind: CustomResourceDefinition
      group: apiextensions.k8s.io
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
