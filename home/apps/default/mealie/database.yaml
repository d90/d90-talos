apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-postgres
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:14
  storage:
    storageClass: nfs-client
    size: 1Gi
  bootstrap:
    initdb:
      database: mealie
      owner: mealie
      secret:
        name: mealie-postgres-secret
  superuserSecret:
    name: mealie-postgres-secret
  monitoring:
    enablePodMonitor: true
