apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app rtunnel-status
  namespace: default
  labels:
    app: *app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *app
  template:
    metadata:
      labels:
        app: *app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: status
          image: python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
          command: ["python", "-u", "/app/status.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: TUNNEL_HOST, value: rtunnel }
            - { name: LB_IP, value: "10.10.100.102" }
            - { name: NETMON_URL, value: "http://rtunnel-netmon/metrics" }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: config, mountPath: /etc/rtunnel, readOnly: true }
      volumes:
        - name: app
          configMap:
            name: rtunnel-status
        - name: config
          configMap:
            name: rtunnel
