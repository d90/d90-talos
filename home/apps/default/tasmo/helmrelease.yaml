apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tasmoadmin
  namespace: default
spec:
  interval: 5m
  timeout: 20m
  chart:
    spec:
      chart: tasmoadmin
      version: "14.1.4"
      sourceRef:
        kind: HelmRepository
        name: tc-truecharts
        namespace: flux-system
      interval: 1h

  values:
    podOptions:
      # TrueCharts' default affinity requires co-location with ANY pod whose PVC
      # has the same short name (e.g. every app's 'config'), chaining unrelated
      # apps to one node. Pointless on NFS; blocks the descheduler from rebalancing.
      defaultAffinity: false

    # ───────────────────────────────────────────────
    # Disable metrics to avoid ServiceMonitor CRDs
    # ───────────────────────────────────────────────
    metrics:
      main:
        enabled: false

    # ───────────────────────────────────────────────
    # Disable built-in ingress
    # ───────────────────────────────────────────────
    ingress:
      main:
        enabled: false

    # ───────────────────────────────────────────────
    # Service definition
    # ───────────────────────────────────────────────
    service:
      main:
        enabled: true
        primary: true
        ports:
          main:
            enabled: true
            primary: true
            protocol: http
            port: 80
            targetPort: 80

    persistence:
      data:
        enabled: true
        type: pvc
        storageClass: nfs-client
        # Must match the existing PVC (created at 100Gi); PVCs can't shrink.
        size: 100Gi
        existingClaim: ""
        mountPath: /data

    # ───────────────────────────────────────────────
    # tasmoadmin Image
    # ───────────────────────────────────────────────
    image:
      repository: ghcr.io/tasmoadmin/tasmoadmin
      tag: "v4.3.4@sha256:9d0869cb47d7d525f69ca555708c00b52dd899acc02e4d3e268bd949e29bb6fd"
      pullPolicy: IfNotPresent

    # ───────────────────────────────────────────────
    # Workload + PRODUCTION-GRADE PROBES
    # ───────────────────────────────────────────────
    workload:
      main:
        type: Deployment
        enabled: true
        primary: true

        podSpec:

          containers:
            main:
              enabled: true
              primary: true
              imageSelector: image

              # ───────────────────────────────────────
              # STABLE PROBES FOR NFS + LARGE LIBRARIES
              # ───────────────────────────────────────

              probes:
                # tasmoadmin becomes ready long before it is fully scanned
                readiness:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    periodSeconds: 10
                    timeoutSeconds: 2
                    failureThreshold: 12   # ~2 minutes
                    successThreshold: 1

                # Liveness probe must be gentle — tasmoadmin can stall briefly
                liveness:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    initialDelaySeconds: 30
                    periodSeconds: 20
                    timeoutSeconds: 2
                    failureThreshold: 10   # ~3 minutes
                    successThreshold: 1

                # Startup probe prevents container kills during long boot
                startup:
                  enabled: true
                  type: http
                  path: /
                  port: main
                  spec:
                    periodSeconds: 10
                    timeoutSeconds: 2
                    failureThreshold: 90   # 15 minutes startup window
