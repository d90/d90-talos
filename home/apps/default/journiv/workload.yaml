apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app journiv
  annotations:
    {}
  labels:
    app: *app
  namespace: default
spec:
  selector:
    matchLabels:
      app: *app
  template:
    metadata:
      labels:
        app: *app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-data-perms
          image: busybox:1.38
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: nfs-conf
              mountPath: /data
              subPath: journiv/
      containers:
        - imagePullPolicy: IfNotPresent
          name: *app
          image: swalabtech/journiv-app:0.1.0-beta.26@sha256:e38be70af0e8ef2a046baa4eefbe2caf6ed177848b18dec454e8770d0b03791d
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            # The image entrypoint picks the process from SERVICE_ROLE; don't set
            # command/args, or it will also run migrations.
            - name: SERVICE_ROLE
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: journiv-postgres-secret
                  key: password
          envFrom:
            - prefix: ''
              configMapRef:
                name: journiv
                optional: false
            - prefix: ''
              secretRef:
                name: journiv-secret
                optional: false
          volumeMounts:
            - name: nfs-conf
              mountPath: /data
              subPath: journiv/
          # Migrations run on startup before gunicorn binds.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
              # Journiv rejects unknown Host headers (400); kubelet sends the pod IP.
              httpHeaders:
                - name: Host
                  value: journiv.d90.name
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              # Journiv rejects unknown Host headers (400); kubelet sends the pod IP.
              httpHeaders:
                - name: Host
                  value: journiv.d90.name
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              # Journiv rejects unknown Host headers (400); kubelet sends the pod IP.
              httpHeaders:
                - name: Host
                  value: journiv.d90.name
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: nfs-conf
          persistentVolumeClaim:
            claimName: nfs-pvc-containerdata
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
